
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Anime Details</title>
<style>
body{margin:0;background:#07070a;color:#fff;font-family:sans-serif;overflow-x:hidden}
.banner{height:60vh;position:relative}
.banner img{width:100%;height:100%;object-fit:cover}
.overlay{position:absolute;inset:0;background:linear-gradient(to top,#07070a,transparent)}
.content{width:min(1300px,92%);margin:auto;margin-top:-120px;position:relative;display:grid;grid-template-columns:320px 1fr;gap:2rem}
.poster{border-radius:24px;overflow:hidden}
.glass{background:rgba(255,255,255,.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);padding:1.5rem;border-radius:24px}
.episodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:1rem;margin-top:2rem}
.ep{padding:1rem;border-radius:14px;background:#15151c;text-align:center}
@media(max-width:900px){.content{grid-template-columns:1fr;margin-top:-60px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API='https://api.jikan.moe/v4';
const id=new URLSearchParams(location.search).get('id')||1;
async function get(url){try{return await(await fetch(url)).json()}catch{return null}}
(async()=>{
const [anime,characters,recs]=await Promise.allSettled([
get(`${API}/anime/${id}/full`),
get(`${API}/anime/${id}/characters`),
get(`${API}/anime/${id}/recommendations`)
]);
const a=anime.value?.data;
if(!a) return document.body.innerHTML='<h1>Failed to load anime.</h1>';
document.getElementById('app').innerHTML=`
<section class="banner">
<img src="${a.images.jpg.large_image_url}">
<div class="overlay"></div>
</section>
<div class="content">
<div>
<img class="poster" src="${a.images.jpg.large_image_url}">
</div>
<div class="glass">
<h1>${a.title}</h1>
<p>${a.synopsis||'No synopsis available.'}</p>
<br>
<p>⭐ ${a.score||'N/A'} • ${a.status}</p>
<br>
<a href="watch.html?id=${a.mal_id}&ep=1" style="display:inline-block;padding:1rem 1.4rem;background:#8b5cf6;border-radius:14px">Watch Now</a>
<h2>Episodes</h2>
<div class="episodes">
${Array.from({length:a.episodes||12},(_,i)=>`<a class="ep" href="watch.html?id=${a.mal_id}&ep=${i+1}">EP ${i+1}</a>`).join('')}
</div>
</div>
</div>`;
})();
</script>
</body>
</html>
