<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Watch Anime</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;overflow-x:hidden}
.layout{display:grid;grid-template-columns:1fr 340px;gap:1rem;padding:1rem}
.player-wrap{background:#111;border-radius:24px;overflow:hidden}
iframe{width:100%;height:70vh;border:none}
.controls{display:flex;gap:1rem;padding:1rem;flex-wrap:wrap}
button,a{padding:.9rem 1rem;border:none;border-radius:12px;background:#8b5cf6;color:#fff;text-decoration:none}
.sidebar{background:#111;border-radius:24px;padding:1rem;max-height:90vh;overflow:auto}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:.7rem}
@media(max-width:900px){.layout{grid-template-columns:1fr}iframe{height:50vh}}
</style>
</head>
<body>
<div class="layout">
<div>
<div class="player-wrap">
<iframe id="player" allowfullscreen></iframe>
</div>
<div class="controls">
<button id="subBtn">Sub</button>
<button id="dubBtn">Dub</button>
<button id="prev">Prev</button>
<button id="next">Next</button>
<button id="theater">Theater</button>
</div>
</div>
<div class="sidebar">
<h2>Episodes</h2>
<div class="ep-grid" id="episodes"></div>
</div>
</div>
<script>
const params=new URLSearchParams(location.search);
const id=params.get('id')||1;
let ep=+params.get('ep')||1;
let mode='sub';
const player=document.getElementById('player');
function load(){player.src=`https://megaplay.buzz/stream/mal/${id}/${ep}/${mode}`}
function updateEpisodes(){
document.getElementById('episodes').innerHTML=Array.from({length:50},(_,i)=>`<a href="?id=${id}&ep=${i+1}">EP ${i+1}</a>`).join('')
}
load();updateEpisodes();
document.getElementById('subBtn').onclick=()=>{mode='sub';load()}
document.getElementById('dubBtn').onclick=()=>{mode='dub';load()}
document.getElementById('next').onclick=()=>{ep++;load()}
document.getElementById('prev').onclick=()=>{if(ep>1)ep--;load()}
document.addEventListener('keydown',e=>{
if(e.key==='f') player.requestFullscreen?.();
if(e.key==='ArrowRight'){ep++;load()}
if(e.key==='ArrowLeft'&&ep>1){ep--;load()}
});
</script>
</body>
</html>
